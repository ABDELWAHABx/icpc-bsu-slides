<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Element · Presenter badge</title>
<link rel="stylesheet" href="../kit/icpc.css">
<script src="../kit/icpc.js" defer></script>
</head>
<body class="element-page">
<!-- ELEMENT presenter · "$ whoami" badge.
     .avatar: initials, or replace with <img src="photo.jpg"> (square photo works best).
     Avatar colour: style="background:var(--crimson|--gold|--blue)". -->

<div class="whoami" data-export="presenter">
  <div class="avatar">MS</div>
  <div class="who">
    <span class="cmd">whoami</span>
    <span class="name">Mohamed Sayed</span>
    <span class="role">Trainer · Level 1</span>
  </div>
</div>

<div class="whoami" data-export="presenter-blue">
  <div class="avatar" style="background:var(--blue); color:var(--parchment);">AH</div>
  <div class="who">
    <span class="cmd">whoami</span>
    <span class="name">Aya Hassan</span>
    <span class="role">Problem Setter · Level 2</span>
  </div>
</div>

</body>
</html>

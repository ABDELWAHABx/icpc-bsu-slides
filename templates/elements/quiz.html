<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Element · Quiz options</title>
<link rel="stylesheet" href="../kit/icpc.css">
<script src="../kit/icpc.js" defer></script>
</head>
<body class="element-page">
<!-- ELEMENT quiz · 4 options (A–D).
     Question version: class="quiz". Answer version: class="quiz reveal" + class="correct" on the right option. -->

<div class="quiz" data-export="quiz-question" style="width:1500px;">
  <div class="opt"><span class="k">A</span><span>O(V + E)</span></div>
  <div class="opt correct"><span class="k">B</span><span>O((V + E) log V)</span></div>
  <div class="opt"><span class="k">C</span><span>O(V · E)</span></div>
  <div class="opt"><span class="k">D</span><span>O(V³)</span></div>
</div>

<div class="quiz reveal" data-export="quiz-answer" style="width:1500px;">
  <div class="opt"><span class="k">A</span><span>O(V + E)</span></div>
  <div class="opt correct"><span class="k">B</span><span>O((V + E) log V)</span></div>
  <div class="opt"><span class="k">C</span><span>O(V · E)</span></div>
  <div class="opt"><span class="k">D</span><span>O(V³)</span></div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Element · Decorations</title>
<link rel="stylesheet" href="../kit/icpc.css">
<script src="../kit/icpc.js" defer></script>
</head>
<body class="element-page">
<!-- ELEMENT decorations · small brand accents. Budget: title slide 3–4, content slide 1–2, code slide 0–1.
     diamonds: data-count = number of diamonds, style="--n:4" = diamonds per row. -->

<div class="diamonds" data-export="diamond-grid" data-count="8" style="--n:4;"></div>
<div class="diamonds" data-export="diamond-row" data-count="6" style="--n:6;"></div>
<div class="stars" data-export="stars"><i></i><i></i><i></i></div>
<div class="include" data-export="include-line"><span class="tk-pre">#include</span> <span class="tk-str">&lt;icpc_bsu.h&gt;</span></div>
<div class="accent-bar tri" data-export="accent-bar" style="margin:0; width:160px; height:12px;"></div>
<div data-export="section-number" style="font:700 360px/.8 var(--f-display); letter-spacing:-.04em; color:var(--crimson); opacity:.14;">02</div>
<div class="h1" data-export="cursor-title">Loading next topic<span class="cursor"></span></div>

</body>
</html>

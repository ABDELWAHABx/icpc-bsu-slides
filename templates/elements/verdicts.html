<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Element · Verdict badges</title>
<link rel="stylesheet" href="../kit/icpc.css">
<script src="../kit/icpc.js" defer></script>
</head>
<body class="element-page">
<!-- ELEMENT verdicts · one PNG per badge. Classes: ac | wa | tle | mle | re | ce.
     You can change the text, e.g. "Wrong Answer on test 4". -->

<span class="verdict ac"  data-export="ac"><span class="ico">✓</span>Accepted</span>
<span class="verdict wa"  data-export="wa"><span class="ico">✗</span>Wrong Answer</span>
<span class="verdict tle" data-export="tle"><span class="ico">⏱</span>Time Limit Exceeded</span>
<span class="verdict mle" data-export="mle"><span class="ico">▦</span>Memory Limit Exceeded</span>
<span class="verdict re"  data-export="re"><span class="ico">!</span>Runtime Error</span>
<span class="verdict ce"  data-export="ce"><span class="ico">⚙</span>Compilation Error</span>

</body>
</html>

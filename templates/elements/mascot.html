<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Element · Mascot expressions</title>
<link rel="stylesheet" href="../kit/icpc.css">
<script src="../kit/icpc.js" defer></script>
</head>
<body class="element-page" data-no-labels style="flex-direction:row; flex-wrap:wrap; gap:110px 80px;">
<!-- ELEMENT mascot · <icpc-mascot mood="…" size="px" label="optional caption">
     moods: focused · happy · waving · thinking · debugging · accepted · wrong-answer · tle
     When to use: title → waving · teaching → focused/thinking · solutions → accepted/happy ·
     bugs → debugging/wrong-answer · slow code → tle.
     NOTE: this is a vector stand-in drawn in code. If you have the official mascot art, use that PNG in Canva instead. -->

<icpc-mascot data-export="focused"      mood="focused"      size="300" label="focused"></icpc-mascot>
<icpc-mascot data-export="happy"        mood="happy"        size="300" label="happy!"></icpc-mascot>
<icpc-mascot data-export="waving"       mood="waving"       size="300" label="hello!"></icpc-mascot>
<icpc-mascot data-export="thinking"     mood="thinking"     size="300" label="thinking…"></icpc-mascot>
<icpc-mascot data-export="debugging"    mood="debugging"    size="300" label="debugging"></icpc-mascot>
<icpc-mascot data-export="accepted"     mood="accepted"     size="300" label="AC'd!"></icpc-mascot>
<icpc-mascot data-export="wrong-answer" mood="wrong-answer" size="300" label="WA…"></icpc-mascot>
<icpc-mascot data-export="tle"          mood="tle"          size="300" label="too slow"></icpc-mascot>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Element · Sample input / output</title>
<link rel="stylesheet" href="../kit/icpc.css">
<script src="../kit/icpc.js" defer></script>
</head>
<body class="element-page">
<!-- ELEMENT sample-io · text inside <pre> is shown exactly as typed (escape "<" as &lt;).
     Change "#1" for multiple samples. -->

<div class="sample-io" data-export="sample-io" style="width:760px;">
  <div class="in"><div class="io-head"><span>INPUT</span><span>#1</span></div>
<pre>4 5
1 2 1
1 3 4
2 3 2
2 4 6
3 4 3</pre></div>
  <div class="out"><div class="io-head"><span>OUTPUT</span><span>#1</span></div>
<pre>6</pre></div>
</div>

</body>
</html>

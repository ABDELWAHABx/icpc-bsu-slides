<div class="ide" data-export="code-cpp" data-file="bfs.cpp" data-lang="cpp" data-highlight="7-8" style="width:1100px;">
<script type="text/x-code">
#include <bits/stdc++.h>
using namespace std;

vector<int> bfs(int s, vector<vector<int>>& g) {
    vector<int> d(g.size(), -1);
    queue<int> q; q.push(s); d[s] = 0;
    while (!q.empty()) {
        int u = q.front(); q.pop();
        for (int v : g[u]) if (d[v] == -1) {
            d[v] = d[u] + 1;
            q.push(v);
        }
    }
    return d;
}
</script>

<div class="ide" data-export="code-python" data-file="dijkstra.py" data-lang="py" data-highlight="7" style="width:1100px;">
<script type="text/x-code">
import heapq

def dijkstra(src, adj):
    dist = [float("inf")] * len(adj)
    dist[src], pq = 0, [(0, src)]
    while pq:
        d, u = heapq.heappop(pq)
        if d > dist[u]: continue  # stale
        for v, w in adj[u]:
            if d + w < dist[v]:
                dist[v] = d + w
                heapq.heappush(pq, (dist[v], v))
    return dist
</script>

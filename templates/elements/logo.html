<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Element · Logo lockups</title>
<link rel="stylesheet" href="../kit/icpc.css">
<script src="../kit/icpc.js" defer></script>
</head>
<body class="element-page">
<!-- ELEMENT logo · the mark here is a PLACEHOLDER drawn in code (pyramid + wheat + Nile).
     To use the official logo: put it at kit/logo.png and write <icpc-logo src="../kit/logo.png" size="120">.
     Attributes: size (px), mono (single-colour version). -->

<div class="logo-lockup" data-export="lockup-horizontal">
  <icpc-logo size="120"></icpc-logo>
  <div class="wm"><b>ICPC-FCAI-BSU</b><span>Better Logic, Bigger Dreams</span></div>
</div>

<div class="logo-lockup" data-export="lockup-casual">
  <icpc-logo size="100"></icpc-logo>
  <div class="wm"><b>ICPC Beni Suef Community</b><span class="mono" style="font:500 22px/1 var(--f-mono); color:var(--muted);">#include &lt;icpc_bsu.h&gt;</span></div>
</div>

<icpc-logo data-export="mark" size="240"></icpc-logo>
<icpc-logo data-export="mark-mono" size="240" mono></icpc-logo>

</body>
</html>

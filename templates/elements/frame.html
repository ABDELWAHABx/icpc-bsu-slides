<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Element · Blank window frame</title>
<link rel="stylesheet" href="../kit/icpc.css">
<script src="../kit/icpc.js" defer></script>
</head>
<body class="slide-page">
<!-- ELEMENT frame · 1920×1080 · the empty branded background for Canva.
     Use as the slide background in Canva and place other element PNGs on top.
     EDIT: tab name(s), statusbar texts. Content area stays empty. -->
<main class="slide" data-export="frame-blank">
  <div class="window">
    <div class="titlebar">
      <div class="lights"><i></i><i></i><i></i></div>
      <div class="tabs"><div class="tab active">untitled.cpp</div></div><!-- EDIT -->
      <div class="winbtns"><span>─</span><span>□</span><span>×</span></div>
    </div>
    <div class="content"></div>
    <div class="statusbar">
      <span class="mode">ICPC</span><!-- EDIT -->
      <span class="mid brand">ICPC-FCAI-BSU</span>
      <span class="page">1 / 1</span><!-- EDIT -->
    </div>
  </div>
</main>
</body>
</html>

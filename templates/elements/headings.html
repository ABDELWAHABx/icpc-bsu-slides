<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Element · Headings</title>
<link rel="stylesheet" href="../kit/icpc.css">
<script src="../kit/icpc.js" defer></script>
</head>
<body class="element-page">
<!-- ELEMENT headings · 3 variants. Each [data-export] block → one transparent PNG.
     accent-bar colours: (default crimson) | tri | gold | blue | wa -->

<div data-export="heading" style="width:1400px;">
  <div class="eyebrow">// 02.1 intuition</div><!-- EDIT -->
  <h1 class="h1">How Dijkstra Works</h1><!-- EDIT -->
  <div class="accent-bar" style="margin-bottom:0;"></div>
</div>

<div data-export="heading-center" style="width:1400px; text-align:center;">
  <div class="eyebrow">// section 02 / 05</div><!-- EDIT -->
  <h1 class="display">Dijkstra's Algorithm</h1><!-- EDIT -->
  <div class="accent-bar tri" style="margin:26px auto 30px;"></div>
  <p class="lead">Single-source shortest paths in <code>O((V+E) log V)</code></p><!-- EDIT -->
</div>

<div data-export="heading-title" style="width:1100px;">
  <div class="include" style="margin-bottom:30px;"><span class="tk-pre">#include</span> <span class="tk-str">&lt;icpc_bsu.h&gt;</span></div>
  <h1 class="display">Graph Theory</h1><!-- EDIT -->
  <div class="accent-bar tri"></div>
  <p class="lead" style="margin-bottom:0;">Shortest Paths &amp; Minimum Spanning Trees</p><!-- EDIT -->
</div>

</body>
</html>
